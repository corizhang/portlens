name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PortLens.sln

      - name: Build
        run: dotnet build PortLens.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PortLens.sln --no-build --configuration Release

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortLens
          path: outputs/PortLensMaterial
          retention-days: 7
