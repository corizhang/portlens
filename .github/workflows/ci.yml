name: Build, Test and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install -g nbgv --version 3.7.112 || dotnet tool update -g nbgv --version 3.7.112 || true

      - name: Compute version
        id: nbgv
        run: |
          nbgv cloud -s GitHubActions
          $info = nbgv get-version -f json | ConvertFrom-Json
          "version=$($info.SimpleVersion)" >> $env:GITHUB_OUTPUT
          "packageVersion=$($info.NuGetPackageVersion)" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$($info.Version)" >> $env:GITHUB_OUTPUT
          "informationalVersion=$($info.AssemblyInformationalVersion)" >> $env:GITHUB_OUTPUT
        shell: pwsh
      - name: Restore
        run: dotnet restore PortLens.sln

      - name: Build
        run: dotnet build PortLens.sln --no-restore --configuration Release -p:Version='${{ steps.nbgv.outputs.version }}' -p:AssemblyVersion='${{ steps.nbgv.outputs.assemblyVersion }}' -p:FileVersion='${{ steps.nbgv.outputs.assemblyVersion }}' -p:InformationalVersion='${{ steps.nbgv.outputs.informationalVersion }}'

      - name: Test
        run: dotnet test PortLens.sln --no-build --configuration Release

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 || true
          $version = '${{ steps.nbgv.outputs.version }}'
          $publishDir = Resolve-Path "outputs\PortLensMaterial"
          ./scripts/generate-wix-files.ps1 -PublishDir $publishDir -OutputPath "installer\Files.wxs"
          dotnet build "installer\PortLens.Installer.wixproj" -c Release -p:PublishDir="$publishDir\" -p:ProductVersion=$version -o "outputs"
          $msi = Get-ChildItem "outputs\*.msi" | Select-Object -First 1
          if ($msi) {
            $newName = "outputs\PortLens-v$version-win-x64.msi"
            Move-Item $msi.FullName $newName -Force
            Write-Host "Created $newName"
          } else {
            throw "MSI not found after build."
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $version = '${{ steps.nbgv.outputs.version }}'
          $zipName = "PortLens-v$version-win-x64.zip"
          Compress-Archive -Path "outputs\PortLensMaterial\*" -DestinationPath "outputs\$zipName" -Force
          Write-Host "Created outputs\$zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortLens-${{ steps.nbgv.outputs.version }}
          path: outputs/PortLensMaterial
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PortLens ${{ steps.nbgv.outputs.version }}
          files: |
            outputs/PortLens-v*.zip
            outputs/PortLens-v*.msi
          generate_release_notes: true
