name: Build, Test and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.0"
          }
          $assemblyVersion = "$version.0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "fileVersion=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "informationalVersion=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore PortLens.sln

      - name: Build
        run: dotnet build PortLens.sln --no-restore --configuration Release -p:Version='${{ steps.version.outputs.version }}' -p:AssemblyVersion='${{ steps.version.outputs.assemblyVersion }}' -p:FileVersion='${{ steps.version.outputs.fileVersion }}' -p:InformationalVersion='${{ steps.version.outputs.informationalVersion }}'

      - name: Test
        run: dotnet test PortLens.sln --no-build --configuration Release

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ steps.version.outputs.version }}' -AssemblyVersion '${{ steps.version.outputs.assemblyVersion }}' -FileVersion '${{ steps.version.outputs.fileVersion }}' -InformationalVersion '${{ steps.version.outputs.informationalVersion }}'

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 || true
          $version = '${{ steps.version.outputs.version }}'
          $publishDir = Resolve-Path "outputs\PortLensMaterial"
          ./scripts/generate-wix-files.ps1 -PublishDir $publishDir -OutputPath "installer\Files.wxs"
          dotnet build "installer\PortLens.Installer.wixproj" -c Release -p:PublishDir="$publishDir\" -p:ProductVersion=$version -o "outputs"
          $msi = Get-ChildItem "outputs\*.msi" | Select-Object -First 1
          if ($msi) {
            $newName = "outputs\PortLens-v$version-win-x64.msi"
            Move-Item $msi.FullName $newName -Force
            Write-Host "Created $newName"
          } else {
            throw "MSI not found after build."
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zipName = "PortLens-v$version-win-x64.zip"
          Compress-Archive -Path "outputs\PortLensMaterial\*" -DestinationPath "outputs\$zipName" -Force
          Write-Host "Created outputs\$zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortLens-${{ steps.version.outputs.version }}
          path: outputs/PortLensMaterial
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PortLens ${{ steps.version.outputs.version }}
          files: |
            outputs/PortLens-v*.zip
            outputs/PortLens-v*.msi
          generate_release_notes: true
